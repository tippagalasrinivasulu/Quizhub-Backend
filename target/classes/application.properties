server.port=8080

# ---- MySQL (change username/password to match your MySQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/quizhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Tables are created/updated automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- JWT (secret must be at least 32 characters) ----
app.jwt.secret=change-this-secret-to-a-long-random-string-32-chars-min
app.jwt.expiration-ms=86400000
